        /* Cyberpunk / Pentester Theme CSS */
        :root {
            --bg-color: #0a0a0f;
            --panel-bg: #0d0d14;
            --neon-cyan: #00ffff;
            --neon-pink: #ff00ff;
            --terminal-green: #00ff00;
            --border-dark: #1a1a2e;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: var(--neon-cyan);
            background-color: var(--bg-color);
        }

        /* --- HEADER UPDATED WITH FLEXBOX FOR CORNER ICONS --- */
        header {
            background: #050508;
            padding: 2.5rem 4rem;
            border-bottom: 1px solid var(--neon-pink);
            box-shadow: 0 4px 15px rgba(255, 0, 255, 0.1);
            
            /* Turns header into a flexbox container */
            display: flex;
            justify-content: space-between; /* Spreads title to left, icons to right */
            align-items: center; /* Vertically centers everything */
        }

        .header-title-block {
            text-align: left;
        }

        header h1 {
            margin: 0;
            font-size: 3rem;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px rgba(0, 255, 255, 0.5);
        }

        header p {
            margin: 0.5rem 0 0 0;
            font-size: 1.2rem;
            color: var(--neon-pink);
            text-shadow: 0 0 3px rgba(255, 0, 255, 0.5);
        }

        /* --- NEW CORNER ICONS STYLE --- */
        .header-icons {
            display: flex;
            gap: 20px; /* Space between icons */
        }

        .header-icons a {
            color: var(--neon-cyan);
            font-size: 1.8rem; /* Makes the icons beautifully readable */
            text-decoration: none;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .header-icons a:hover {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            transform: scale(1.1); /* Slight pop effect on hover */
        }

        /* --- Rest of Layout Container --- */
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        section {
            background: var(--panel-bg);
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid #1f1f3a;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.05);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-pink);
            border-bottom: 1px solid #330033;
            padding-bottom: 0.5rem;
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--neon-pink), 0 0 15px rgba(255, 0, 255, 0.4);
            letter-spacing: 1px;
            margin-top: 0;
        }

        h2::before {
            content: "> ";
            color: var(--neon-cyan);
            text-shadow: none;
        }

        .project-card {
            background: #050508;
            padding: 1rem 1.5rem;
            margin-top: 1.5rem;
            border: 1px solid var(--border-dark);
            border-left: 3px solid var(--terminal-green);
            border-radius: 2px;
            color: var(--terminal-green);
        }

        .project-card h3 {
            margin-top: 0;
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
        }

        .contact-links {
            margin-top: 1.5rem;
        }
